---
- name: Install and Configure SonarQube Server
  hosts: sonar
  become: yes
  gather_facts: yes

  vars:
    sonar_version: "25.7.0.110598"
    sonar_download_url: "https://binaries.sonarsource.com/Distribution/sonarqube/sonarqube-25.7.0.110598.zip"

    sonar_home: /opt/sonarqube
    sonar_user: sonar
    sonar_group: sonar

    postgres_db: sonarqube
    postgres_user: sonar
    postgres_password: sonar123

  tasks:

########################################################################
# UPDATE
########################################################################

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

########################################################################
# JAVA
########################################################################

    - name: Install Java 21
      apt:
        name: openjdk-21-jdk
        state: present

########################################################################
# POSTGRESQL
########################################################################

    - name: Install PostgreSQL
      apt:
        name:
          - postgresql
          - postgresql-contrib
        state: present

    - name: Enable PostgreSQL
      service:
        name: postgresql
        state: started
        enabled: yes

########################################################################
# DATABASE
########################################################################

    - name: Create Sonar PostgreSQL User
      shell: |
        sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ postgres_user }}'" | grep -q 1 || \
        sudo -u postgres psql -c "CREATE USER {{ postgres_user }} WITH PASSWORD '{{ postgres_password }}';"
      args:
        executable: /bin/bash

    - name: Create Sonar Database
      shell: |
        sudo -u postgres psql -lqt | cut -d \| -f1 | grep -qw {{ postgres_db }} || \
        sudo -u postgres createdb -O {{ postgres_user }} {{ postgres_db }}
      args:
        executable: /bin/bash

########################################################################
# UTILITIES
########################################################################

    - name: Install unzip wget
      apt:
        name:
          - unzip
          - wget
        state: present

########################################################################
# DOWNLOAD SONARQUBE
########################################################################

    - name: Download SonarQube
      get_url:
        url: "{{ sonar_download_url }}"
        dest: /tmp/sonarqube.zip
        mode: '0644'

    - name: Extract SonarQube
      unarchive:
        src: /tmp/sonarqube.zip
        dest: /opt
        remote_src: yes
        creates: "/opt/sonarqube-{{ sonar_version }}"

    - name: Rename SonarQube Folder
      command: mv /opt/sonarqube-{{ sonar_version }} {{ sonar_home }}
      args:
        creates: "{{ sonar_home }}"

########################################################################
# USER
########################################################################

    - name: Create Sonar Group
      group:
        name: "{{ sonar_group }}"
        state: present

    - name: Create Sonar User
      user:
        name: "{{ sonar_user }}"
        group: "{{ sonar_group }}"
        shell: /bin/bash
        system: yes
        create_home: no

    - name: Change Ownership
      file:
        path: "{{ sonar_home }}"
        owner: "{{ sonar_user }}"
        group: "{{ sonar_group }}"
        recurse: yes

########################################################################
# CONFIGURATION
########################################################################

    - name: Configure sonar.properties
      blockinfile:
        path: "{{ sonar_home }}/conf/sonar.properties"
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |

          sonar.jdbc.username={{ postgres_user }}
          sonar.jdbc.password={{ postgres_password }}
          sonar.jdbc.url=jdbc:postgresql://localhost/{{ postgres_db }}

          sonar.web.host=0.0.0.0
          sonar.web.port=9000

    - name: Configure sonar.sh
      lineinfile:
        path: "{{ sonar_home }}/bin/linux-x86-64/sonar.sh"
        regexp: "^RUN_AS_USER="
        line: "RUN_AS_USER={{ sonar_user }}"

########################################################################
# LINUX TUNING
########################################################################

    - name: vm.max_map_count
      sysctl:
        name: vm.max_map_count
        value: "524288"
        state: present
        reload: yes

    - name: fs.file-max
      sysctl:
        name: fs.file-max
        value: "131072"
        state: present
        reload: yes

########################################################################
# SYSTEMD
########################################################################

    - name: Create SonarQube Service
      copy:
        dest: /etc/systemd/system/sonarqube.service
        mode: "0644"
        content: |
          [Unit]
          Description=SonarQube
          After=network.target postgresql.service

          [Service]
          Type=forking

          User=sonar
          Group=sonar

          ExecStart=/opt/sonarqube/bin/linux-x86-64/sonar.sh start
          ExecStop=/opt/sonarqube/bin/linux-x86-64/sonar.sh stop

          Restart=always
          LimitNOFILE=65536
          LimitNPROC=4096

          [Install]
          WantedBy=multi-user.target

########################################################################
# START
########################################################################

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Enable SonarQube
      systemd:
        name: sonarqube
        enabled: yes

    - name: Start SonarQube
      systemd:
        name: sonarqube
        state: started

########################################################################
# WAIT
########################################################################

    - name: Wait for Port 9000
      wait_for:
        port: 9000
        delay: 20
        timeout: 300

########################################################################
# VERIFY
########################################################################

    - name: Verify Java
      command: java -version
      register: java_version
      changed_when: false

    - debug:
        var: java_version.stderr_lines

    - name: Verify PostgreSQL
      command: psql --version
      register: postgres_version
      changed_when: false

    - debug:
        var: postgres_version.stdout

    - name: Verify SonarQube
      command: systemctl is-active sonarqube
      register: sonar_status
      changed_when: false

    - debug:
        var: sonar_status.stdout

    - name: Verify Port
      shell: ss -tulpn | grep 9000
      register: sonar_port
      changed_when: false

    - debug:
        var: sonar_port.stdout_lines

########################################################################
# SUCCESS
########################################################################

    - name: Success Message
      debug:
        msg:
          - "======================================"
          - " SonarQube Installation Successful "
          - " URL : http://{{ inventory_hostname }}:9000"
          - " Username : admin"
          - " Password : admin"
          - "======================================"
